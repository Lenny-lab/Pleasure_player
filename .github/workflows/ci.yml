name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 语法 / 安装 / 启动冒烟（最便宜的三平台矩阵）──
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Linux display
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64

      - name: Install
        run: npm ci
        env:
          # 国内 / 防火墙网络需要；其他环境自动忽略
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Syntax check (main process)
        run: node -e "require('./main.js')" 2>&1 | head -5
        continue-on-error: true

      - name: Syntax check (preload)
        run: node -e "require('./preload.js')" 2>&1 | head -5
        continue-on-error: true

      - name: Boot smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm start &
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 1

      - name: Boot smoke (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm start &
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 1

      - name: Verify boot
        if: always()
        run: |
          echo "smoke test completed (no assertions; success = process started cleanly)"

  # ── 构建（仅在打 tag / 手动触发时跑；平时可选）──
  build:
    name: Build release (${{ matrix.os }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pleasure-${{ matrix.os }}
          path: dist/*.dmg,dist/*.exe,dist/*.AppImage,dist/*.deb,dist/*.zip
          if-no-files-found: ignore
